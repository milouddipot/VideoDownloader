name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip openjdk-17-jdk \
            python3-pip autoconf libtool \
            pkg-config zlib1g-dev libncurses5-dev \
            libncursesw5-dev libtinfo5 cmake \
            libffi-dev libssl-dev build-essential

      - name: Install Buildozer
        run: pip install buildozer cython

      - name: Build APK
        run: |
          yes | buildozer android debug 2>&1 | tee build.log
          exit ${PIPESTATUS[0]}

      - name: Show errors if failed
        if: failure()
        run: |
          echo "========= ERRORS ONLY ========="
          grep -i "error\|exception\|failed\|traceback" build.log | tail -50

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: VideoDownloader
          path: bin/*.apk

      - name: Upload build log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
